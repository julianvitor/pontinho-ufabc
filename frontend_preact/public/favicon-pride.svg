<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente linear das cores do Orgulho LGBT+ -->
    <linearGradient id="prideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="20%" stop-color="#ff7a18"/>
      <stop offset="40%" stop-color="#ffd200"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Brilho externo arco-íris -->
    <filter id="prideGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ec4899" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo escuro premium -->
  <rect width="64" height="64" rx="16" fill="#090d16"/>
  <!-- Borda com gradiente pride suave -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#prideGrad)" stroke-width="1.8" stroke-opacity="0.7"/>

  <!-- O Pontinho com gradiente do Orgulho LGBT+ -->
  <circle cx="32" cy="32" r="16" fill="url(#prideGrad)" filter="url(#prideGlow)"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>

  <!-- Brilho especular sutil -->
  <circle cx="27" cy="27" r="4.5" fill="#ffffff" opacity="0.75"/>
</svg>
