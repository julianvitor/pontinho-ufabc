<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pontinho</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <script src="/js/face-api.js"></script>
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem('pontinho_theme') || 'ufabc';
          if (savedTheme === 'pride') {
            document.documentElement.classList.add('theme-pride');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#090d16] text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white relative overflow-x-hidden">
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
