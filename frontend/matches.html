<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pontinho - Conversas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ufabc: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

  <!-- CABEÇALHO / NAVBAR -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <a href="./index.html" class="flex items-center group">
        <span class="font-black text-2xl tracking-tight bg-gradient-to-r from-emerald-700 to-teal-800 bg-clip-text text-transparent">Pontinho</span>
      </a>

      <!-- Navegação Principal -->
      <nav class="flex items-center gap-1 sm:gap-2">
        <a href="./index.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-slate-600 hover:text-emerald-700 hover:bg-slate-50 font-medium text-sm transition">
          <span>🔥</span> <span class="hidden sm:inline">Swipes</span>
        </a>
        <a href="./matches.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 font-semibold text-sm border border-emerald-200/60 shadow-xs">
          <span>💬</span> <span class="hidden sm:inline">Conversas</span>
        </a>
        <a href="./profile.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-slate-600 hover:text-emerald-700 hover:bg-slate-50 font-medium text-sm transition">
          <span>👤</span> <span class="hidden sm:inline">Meu Perfil</span>
        </a>
        <a href="./admin.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-amber-700 bg-amber-50 hover:bg-amber-100 font-medium text-sm border border-amber-200/60 transition">
          <span>⚙️</span> <span class="hidden sm:inline">Admin</span>
        </a>
      </nav>

      <!-- Seletor Rápido de Usuário e Botão Sair -->
      <div class="flex items-center gap-2">
        <div class="hidden md:flex items-center gap-1.5 bg-slate-50 px-2.5 py-1 rounded-xl border border-slate-200 text-xs">
          <span class="text-slate-400 font-medium">RA:</span>
          <select id="user-switcher-select" class="bg-transparent font-semibold text-slate-700 focus:outline-none cursor-pointer">
            <option>Carregando...</option>
          </select>
        </div>
        <button onclick="Pontinho.logout()" class="px-2.5 py-1 text-xs font-bold text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-xl border border-rose-200/60 transition" title="Sair da conta">
          Sair
        </button>
      </div>
    </div>
  </header>

  <!-- ÁREA DE CHAT & MATCHES (MOBILE-FIRST) -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-2 sm:p-6 pb-24 md:pb-6 flex flex-col h-[calc(100dvh-75px)] md:h-[620px]">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden flex-1 flex flex-col md:flex-row h-full">
      
      <!-- COLUNA DA ESQUERDA: LISTA DE MATCHES -->
      <div id="matches-sidebar" class="w-full md:w-80 border-r border-slate-100 flex flex-col bg-slate-50/50 h-full">
        
        <div class="p-3.5 border-b border-slate-100 flex items-center justify-between">
          <h2 class="font-extrabold text-slate-900 text-base">Matches</h2>
          <span id="matches-count-badge" class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full font-bold text-xs">0</span>
        </div>

        <!-- Lista scrollável -->
        <div id="matches-list-container" class="flex-1 overflow-y-auto divide-y divide-slate-100 p-2 space-y-1">
          <div class="p-8 text-center text-slate-400 text-xs">Carregando...</div>
        </div>
      </div>

      <!-- COLUNA DA DIREITA: JANELA DO CHAT -->
      <div id="chat-window" class="flex-1 hidden md:flex flex-col bg-white h-full">
        
        <!-- ESTADO QUANDO NENHUM MATCH ESTÁ SELECIONADO -->
        <div id="no-chat-selected" class="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-400">
          <div class="w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl mb-2.5">
            💬
          </div>
          <h3 class="font-bold text-slate-700 text-sm">Selecione uma conversa</h3>
        </div>

        <!-- ÁREA DO CHAT ATIVO -->
        <div id="active-chat-container" class="hidden flex-1 flex flex-col h-full">
          
          <!-- Cabeçalho do Chat -->
          <div class="px-4 py-2.5 border-b border-slate-100 flex items-center justify-between bg-slate-50/70">
            <div class="flex items-center gap-2.5">
              <button onclick="backToMatchesList()" class="md:hidden text-slate-600 hover:text-slate-900 px-2 py-1 bg-white rounded-lg shadow-xs border border-slate-200 font-bold text-xs">
                ←
              </button>
              <img id="chat-partner-avatar" src="" alt="Avatar" class="w-9 h-9 rounded-full object-cover border-2 border-emerald-500 shadow-sm">
              <div>
                <h3 id="chat-partner-name" class="font-bold text-slate-900 text-sm leading-tight">Nome</h3>
                <p id="chat-partner-sub" class="text-[11px] text-emerald-700 font-medium">Curso • Campus</p>
              </div>
            </div>
            <a href="./index.html" class="text-xs text-slate-500 hover:text-emerald-700 font-semibold px-2 py-1 rounded-lg hover:bg-slate-100 transition">
              🔥 Feed
            </a>
          </div>

          <!-- BANNER DE CONTEÚDO PRIVADO & PICANTE -->
          <div id="private-access-banner" class="hidden px-4 py-2.5 bg-gradient-to-r from-rose-950 via-slate-900 to-rose-950 text-white border-b border-rose-500/20 text-xs flex flex-wrap items-center justify-between gap-2 shadow-inner">
            <!-- Conteúdo dinâmico do banner -->
          </div>

          <!-- Mensagens de Texto (Scroll) -->
          <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-2.5 bg-gradient-to-b from-white to-slate-50/50">
            <!-- Mensagens são adicionadas aqui -->
          </div>

          <!-- Formulário de Envio -->
          <div class="p-3 border-t border-slate-100 bg-white">
            <form id="message-form" onsubmit="sendMessage(event)" class="flex items-center gap-2">
              <input 
                id="message-input" 
                type="text" 
                placeholder="Mensagem..." 
                required 
                maxlength="500" 
                class="flex-1 bg-slate-100 border border-slate-200 rounded-2xl px-4 py-2.5 text-xs sm:text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition"
              >
              <button type="submit" class="px-4 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-semibold text-xs rounded-xl shadow-sm transition">
                Enviar
              </button>
            </form>
          </div>

        </div>

      </div>

    </div>
  </main>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR MOBILE (BOTTOM BAR) -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 mobile-bottom-nav flex items-center justify-around py-2.5 shadow-lg">
    <a href="./index.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-600 font-semibold text-[11px] transition">
      <span class="text-xl">🔥</span>
      <span>Swipes</span>
    </a>
    <a href="./matches.html" class="flex flex-col items-center gap-1 text-emerald-700 font-bold text-[11px]">
      <span class="text-xl">💬</span>
      <span>Conversas</span>
    </a>
    <a href="./profile.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-emerald-600 font-semibold text-[11px] transition">
      <span class="text-xl">👤</span>
      <span>Perfil</span>
    </a>
    <a href="./admin.html" class="flex flex-col items-center gap-1 text-slate-400 hover:text-amber-600 font-semibold text-[11px] transition">
      <span class="text-xl">⚙️</span>
      <span>Admin</span>
    </a>
  </nav>

  <!-- MODAL: ÁLBUM & BIO SECRETA DESBLOQUEADOS -->
  <div id="unlocked-private-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3 sm:p-4">
    <div class="bg-gradient-to-b from-slate-950 via-slate-900 to-black text-white w-full max-w-lg rounded-3xl border border-rose-500/30 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <!-- Header do Modal -->
      <div class="p-4 border-b border-white/10 flex items-center justify-between bg-white/5">
        <div class="flex items-center gap-2">
          <span class="text-xl">🔥</span>
          <div>
            <h3 id="unlocked-modal-title" class="font-black text-sm sm:text-base text-rose-300">Conteúdo Secreto</h3>
            <p class="text-[11px] text-slate-400">Liberado exclusivamente após match e autorização</p>
          </div>
        </div>
        <button onclick="closeUnlockedModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center text-xs font-bold transition">
          ✕
        </button>
      </div>

      <!-- Conteúdo do Modal (Scroll) -->
      <div class="p-4 sm:p-5 overflow-y-auto space-y-4">
        <!-- Bio Secreta -->
        <div id="unlocked-bio-card" class="hidden p-4 rounded-2xl bg-rose-950/40 border border-rose-500/30 text-rose-100">
          <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400 block mb-1">💋 Bio Privada</span>
          <p id="unlocked-bio-text" class="text-xs sm:text-sm leading-relaxed font-medium italic"></p>
        </div>

        <!-- Galeria de Fotos Privadas -->
        <div>
          <span class="text-[10px] font-bold uppercase tracking-wider text-rose-400 block mb-2">📸 Fotos Secretas</span>
          <div id="unlocked-photos-grid" class="grid grid-cols-2 gap-2.5">
            <!-- Fotos inseridas dinamicamente -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/app.js"></script>
  <script>
    let matchesList = [];
    let selectedMatchId = null;
    let pollInterval = null;
    let currentPrivateStatus = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await Pontinho.requireAuth();
      if (!user) return;
      await Pontinho.initNavbarUserSwitcher();
      loadMatches();
    });

    async function loadMatches() {
      const container = document.getElementById('matches-list-container');
      const badge = document.getElementById('matches-count-badge');

      try {
        matchesList = await Pontinho.apiFetch('/api/matches');
        badge.innerText = matchesList.length;

        if (matchesList.length === 0) {
          container.innerHTML = `
            <div class="p-8 text-center text-slate-400 text-xs">
              <span class="text-3xl block mb-2">💔</span>
              Você ainda não tem nenhum match. Dê likes no feed de swipes para encontrar alguém!
            </div>
          `;
          return;
        }

        container.innerHTML = matchesList.map(m => {
          const partner = m.partner;
          const photo = (partner.photos && partner.photos[0]) || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800';
          const lastMsg = m.last_message ? m.last_message.text : 'Novo match! Diga um oi 👋';
          const isSelected = m.match_id === selectedMatchId;

          return `
            <div 
              onclick="selectMatch(${m.match_id})"
              class="p-3 rounded-2xl cursor-pointer transition flex items-center gap-3 ${isSelected ? 'bg-emerald-50 border border-emerald-200' : 'hover:bg-slate-100/80'}"
            >
              <img src="${photo}" class="w-12 h-12 rounded-full object-cover border border-slate-200 shadow-xs">
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between">
                  <h4 class="font-bold text-slate-900 text-sm truncate">${partner.name}</h4>
                  <span class="text-[10px] text-slate-400">${partner.campus === 'Santo André' ? 'SA' : 'SBC'}</span>
                </div>
                <p class="text-xs text-slate-500 truncate mt-0.5">${lastMsg}</p>
              </div>
            </div>
          `;
        }).join('');

        // Se veio com id na URL ou primeiro da lista
        const urlParams = new URLSearchParams(window.location.search);
        const matchParam = urlParams.get('match_id');
        if (matchParam) {
          selectMatch(parseInt(matchParam, 10));
        } else if (!selectedMatchId && matchesList.length > 0 && window.innerWidth >= 768) {
          selectMatch(matchesList[0].match_id);
        }

      } catch (err) {
        container.innerHTML = `<div class="p-4 text-xs text-rose-500">${err.message}</div>`;
      }
    }

    async function selectMatch(matchId) {
      selectedMatchId = matchId;

      // Em telas pequenas (mobile), esconde a lista de matches e foca o chat
      if (window.innerWidth < 768) {
        document.getElementById('matches-sidebar').classList.add('hidden');
        document.getElementById('chat-window').classList.remove('hidden');
      }

      document.getElementById('no-chat-selected').classList.add('hidden');
      document.getElementById('active-chat-container').classList.remove('hidden');

      // Atualiza visual da lista
      document.querySelectorAll('#matches-list-container > div').forEach(el => {
        el.classList.remove('bg-emerald-50', 'border', 'border-emerald-200');
      });

      await fetchMessages(true);
      await loadPrivateStatus(matchId);

      // Inicia polling a cada 3 segundos
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(() => {
        if (selectedMatchId) {
          fetchMessages(false);
          loadPrivateStatus(selectedMatchId);
        }
      }, 3000);
    }

    function backToMatchesList() {
      document.getElementById('matches-sidebar').classList.remove('hidden');
      document.getElementById('chat-window').classList.add('hidden');
    }

    async function loadPrivateStatus(matchId) {
      const banner = document.getElementById('private-access-banner');
      if (!banner) return;

      try {
        const data = await Pontinho.apiFetch(`/api/matches/${matchId}/private-status`);
        currentPrivateStatus = data;

        // Caso 1: O parceiro pediu acesso aos meus conteúdos privados
        if (data.their_request_status === 'pending') {
          banner.classList.remove('hidden');
          banner.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="text-base">🔥</span>
              <span><strong>${data.partner_name}</strong> pediu acesso às suas fotos e bio secretas!</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="respondPrivateAccess('approve')" class="px-3 py-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 rounded-lg text-white font-bold text-xs shadow-sm">
                Liberar 🔓
              </button>
              <button onclick="respondPrivateAccess('reject')" class="px-2.5 py-1 bg-white/10 hover:bg-white/20 rounded-lg text-slate-300 font-semibold text-xs">
                Recusar
              </button>
            </div>
          `;
          return;
        }

        // Caso 2: O parceiro possui conteúdo privado cadastrado
        if (data.partner_has_private) {
          banner.classList.remove('hidden');

          if (data.my_request_status === 'none') {
            banner.innerHTML = `
              <div class="flex items-center gap-2">
                <span class="text-base">🔥</span>
                <span>${data.partner_name} possui <strong>${data.partner_private_count} foto(s) e bio secreta</strong>.</span>
              </div>
              <button onclick="requestPrivateAccess()" class="px-3 py-1 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-bold text-xs rounded-lg shadow-sm">
                Solicitar Acesso 🔒
              </button>
            `;
          } else if (data.my_request_status === 'pending') {
            banner.innerHTML = `
              <div class="flex items-center gap-2 text-rose-200">
                <span class="text-base">⏳</span>
                <span>Pedido enviado... Aguardando autorização de ${data.partner_name}.</span>
              </div>
            `;
          } else if (data.my_request_status === 'rejected') {
            banner.innerHTML = `
              <div class="flex items-center gap-2 text-slate-300">
                <span class="text-base">🔒</span>
                <span>${data.partner_name} preferiu manter o conteúdo privado.</span>
              </div>
              <button onclick="requestPrivateAccess()" class="px-2.5 py-1 bg-white/10 hover:bg-white/20 text-slate-200 text-xs rounded-lg font-semibold">
                Pedir de novo
              </button>
            `;
          } else if (data.my_request_status === 'approved') {
            banner.innerHTML = `
              <div class="flex items-center gap-2 text-rose-300">
                <span class="text-base">🔥</span>
                <span>Álbum Secreto & Bio Privada liberados por <strong>${data.partner_name}</strong>!</span>
              </div>
              <button onclick="openUnlockedModal()" class="px-3 py-1 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-bold text-xs rounded-lg shadow-md flex items-center gap-1">
                <span>🔥</span> Ver Fotos & Bio
              </button>
            `;
          }
        } else {
          banner.classList.add('hidden');
        }

      } catch (err) {
        console.error('Erro ao verificar status privado:', err);
        banner.classList.add('hidden');
      }
    }

    async function requestPrivateAccess() {
      if (!selectedMatchId) return;
      try {
        await Pontinho.apiFetch(`/api/matches/${selectedMatchId}/request-private`, { method: 'POST' });
        Pontinho.showToast('Solicitação de fotos privadas enviada! 🔥', 'success');
        await loadPrivateStatus(selectedMatchId);
        await fetchMessages(true);
      } catch (err) {
        Pontinho.showToast(err.message, 'error');
      }
    }

    async function respondPrivateAccess(action) {
      if (!selectedMatchId) return;
      try {
        await Pontinho.apiFetch(`/api/matches/${selectedMatchId}/respond-private`, {
          method: 'POST',
          body: JSON.stringify({ action })
        });
        Pontinho.showToast(action === 'approve' ? 'Álbum privado liberado! 🔓' : 'Solicitação recusada.', 'success');
        await loadPrivateStatus(selectedMatchId);
        await fetchMessages(true);
      } catch (err) {
        Pontinho.showToast(err.message, 'error');
      }
    }

    function openUnlockedModal() {
      if (!currentPrivateStatus || !currentPrivateStatus.unlocked_content) return;
      const content = currentPrivateStatus.unlocked_content;
      document.getElementById('unlocked-modal-title').innerText = `Álbum Secreto • ${currentPrivateStatus.partner_name}`;

      const bioCard = document.getElementById('unlocked-bio-card');
      const bioText = document.getElementById('unlocked-bio-text');
      if (content.private_bio && content.private_bio.trim()) {
        bioText.innerText = content.private_bio;
        bioCard.classList.remove('hidden');
      } else {
        bioCard.classList.add('hidden');
      }

      const grid = document.getElementById('unlocked-photos-grid');
      const photos = content.private_photos || [];
      if (photos.length > 0) {
        grid.innerHTML = photos.map((p, idx) => `
          <div class="relative rounded-2xl overflow-hidden aspect-square border border-rose-500/40 shadow-lg group">
            <img src="${p}" class="w-full h-full object-cover">
            <span class="absolute bottom-2 left-2 px-2 py-0.5 rounded-full bg-black/60 text-white text-[10px] font-bold">
              #${idx + 1}
            </span>
          </div>
        `).join('');
      } else {
        grid.innerHTML = `<p class="col-span-2 text-xs text-slate-400">Nenhuma foto adicionada.</p>`;
      }

      document.getElementById('unlocked-private-modal').classList.remove('hidden');
    }

    function closeUnlockedModal() {
      document.getElementById('unlocked-private-modal').classList.add('hidden');
    }

    async function fetchMessages(shouldScroll = false) {
      if (!selectedMatchId) return;

      try {
        const data = await Pontinho.apiFetch(`/api/matches/${selectedMatchId}/messages`);
        
        // Atualiza header
        const partner = data.partner;
        const photo = (partner.photos && partner.photos[0]) || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800';
        document.getElementById('chat-partner-avatar').src = photo;
        document.getElementById('chat-partner-name').innerText = partner.name || 'Estudante';
        document.getElementById('chat-partner-sub').innerText = `${partner.course || 'Curso'} • Campus ${partner.campus || 'SA'}`;

        // Renderiza mensagens
        const container = document.getElementById('messages-container');
        const currentUserId = data.current_user_id;

        if (data.messages.length === 0) {
          container.innerHTML = `
            <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs py-10">
              <p>Vocês deram match! Mande a primeira mensagem de texto.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = data.messages.map(msg => {
          const isMine = msg.sender_id === currentUserId;
          const time = new Date(msg.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

          return `
            <div class="flex flex-col ${isMine ? 'items-end' : 'items-start'}">
              <div class="max-w-[80%] rounded-2xl px-4 py-2.5 text-sm shadow-xs ${
                isMine 
                  ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-br-xs' 
                  : 'bg-slate-100 text-slate-800 rounded-bl-xs border border-slate-200/60'
              }">
                <p class="leading-relaxed break-words">${escapeHtml(msg.text)}</p>
                <span class="text-[10px] block mt-1 opacity-70 text-right">${time}</span>
              </div>
            </div>
          `;
        }).join('');

        if (shouldScroll) {
          container.scrollTop = container.scrollHeight;
        }
      } catch (err) {
        console.error('Erro ao buscar mensagens:', err);
      }
    }

    async function sendMessage(e) {
      e.preventDefault();
      if (!selectedMatchId) return;

      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';

      try {
        await Pontinho.apiFetch(`/api/matches/${selectedMatchId}/messages`, {
          method: 'POST',
          body: JSON.stringify({ text })
        });

        await fetchMessages(true);
        loadMatches(); // Atualiza preview na lista
      } catch (err) {
        Pontinho.showToast(err.message, 'error');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
