<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pontinho UFABC - Conexões, Amizades e Festas Universitárias</title>
    <meta name="description" content="Aplicativo mobile-first para conexões, conversas, encontros e festas universitárias exclusivo para a comunidade acadêmica da UFABC." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pontinho.julianvitor.com.br/" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />

    <!-- Open Graph / Redes Sociais -->
    <meta property="og:title" content="Pontinho UFABC - Conexões e Festas Universitárias" />
    <meta property="og:description" content="Aplicativo exclusivo para estudantes da UFABC. Conexões, fotos secretas, trilha sonora e mural de festas." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pontinho.julianvitor.com.br/" />
    <meta property="og:image" content="https://pontinho.julianvitor.com.br/favicon.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />

    <!-- Otimização de Fontes: Preload e carregamento assíncrono para eliminar render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" />
    </noscript>

    <!-- Script inline para aplicar tema persistido sem FOUC (Flash of Unstyled Content) -->
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem('pontinho_theme') || 'ufabc';
          if (savedTheme === 'pride') {
            document.documentElement.classList.add('theme-pride');
          } else if (savedTheme === 'halloween') {
            document.documentElement.classList.add('theme-halloween');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#090d16] text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white relative overflow-x-hidden">
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
