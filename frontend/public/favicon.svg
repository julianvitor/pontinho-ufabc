<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Fundo escuro estilizado compatível com dark e light mode -->
  <rect width="64" height="64" rx="16" fill="#090d16"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- O Pontinho verde esmeralda brilhante -->
  <circle cx="32" cy="32" r="16" fill="url(#glow)" filter="url(#shadow)"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.9"/>
  <!-- Brilho especular sutil -->
  <circle cx="27" cy="27" r="4.5" fill="#ffffff" opacity="0.65"/>
</svg>
