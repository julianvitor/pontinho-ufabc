<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pontinho - Entrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ufabc: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-[100dvh] flex flex-col justify-center items-center p-3 sm:p-4 text-slate-100 font-sans antialiased">

  <!-- CARD PRINCIPAL DE AUTENTICAÇÃO -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100 text-slate-800 transition-all">
    
    <!-- CABEÇALHO -->
    <div class="bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 py-6 px-8 text-center text-white relative">
      <h1 class="text-3xl font-black tracking-tight">Pontinho</h1>
    </div>

    <!-- SELETOR DE ABAS: LOGIN OU CADASTRO -->
    <div class="flex border-b border-slate-100 bg-slate-50">
      <button 
        id="tab-btn-login" 
        onclick="switchAuthTab('login')" 
        class="flex-1 py-3.5 text-xs sm:text-sm font-bold text-emerald-700 border-b-2 border-emerald-600 bg-white transition"
      >
        Entrar
      </button>
      <button 
        id="tab-btn-register" 
        onclick="switchAuthTab('register')" 
        class="flex-1 py-3.5 text-xs sm:text-sm font-semibold text-slate-500 hover:text-slate-800 transition"
      >
        Cadastrar-se
      </button>
    </div>

    <div class="p-5 sm:p-6">
      
      <!-- ABA 1: FORMULÁRIO DE LOGIN -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">E-mail ou RA</label>
          <input 
            id="login-email" 
            type="text" 
            required 
            placeholder="nome@aluno.ufabc.edu.br" 
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition"
          >
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Senha</label>
          <input 
            id="login-password" 
            type="password" 
            required 
            placeholder="••••••••" 
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition"
          >
        </div>

        <button 
          type="submit" 
          class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md transition"
        >
          Entrar
        </button>
      </form>

      <!-- ABA 2: FORMULÁRIO DE CADASTRO -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3.5 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">E-mail</label>
          <input 
            id="reg-email" 
            type="email" 
            required 
            placeholder="seu.email@exemplo.com" 
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition"
          >
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nome</label>
          <input 
            id="reg-name" 
            type="text" 
            required 
            placeholder="Como quer ser chamado(a)" 
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition"
          >
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Senha</label>
          <input 
            id="reg-password" 
            type="password" 
            required 
            minlength="4" 
            placeholder="Mínimo 4 caracteres" 
            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 focus:border-emerald-500 transition"
          >
        </div>

        <button 
          type="submit" 
          class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-md transition"
        >
          Criar Conta
        </button>
      </form>

      <!-- ATALHOS RÁPIDOS PARA CONTAS DE TESTE (CARREGADOS DINAMICAMENTE DO BACKEND) -->
      <div id="demo-section" class="mt-6 pt-5 border-t border-slate-100 text-center">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-2">
          Contas Demo:
        </span>
        <div id="demo-buttons-container" class="flex flex-wrap gap-1.5 justify-center">
          <span class="text-xs text-slate-400">Carregando contas...</span>
        </div>
      </div>

    </div>
  </div>

  <script src="./js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('tab') === 'register') {
        switchAuthTab('register');
      }
      loadDemoAccounts();
    });

    async function loadDemoAccounts() {
      const container = document.getElementById('demo-buttons-container');
      const section = document.getElementById('demo-section');
      if (!container) return;

      try {
        const accounts = await Pontinho.apiFetch('/api/auth/demo-accounts');
        if (!accounts || accounts.length === 0) {
          if (section) section.classList.add('hidden');
          return;
        }

        container.innerHTML = accounts.map(acc => {
          const isAdmin = acc.is_admin;
          const btnClass = isAdmin 
            ? "px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-800 rounded-lg text-[11px] font-bold border border-amber-200/60 transition"
            : "px-2.5 py-1 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-600 rounded-lg text-[11px] font-medium transition";
          
          const shortName = (acc.name || 'Usuário').split(' ')[0];
          const displayName = isAdmin ? `${shortName} (Admin)` : shortName;
          const escapedEmail = (acc.email || '').replace(/'/g, "\\'");
          const escapedPass = (acc.password || '123456').replace(/'/g, "\\'");
          
          return `<button type="button" onclick="fillDemo('${escapedEmail}', '${escapedPass}')" class="${btnClass}">${displayName}</button>`;
        }).join('');
      } catch (err) {
        console.warn('Não foi possível carregar contas demo:', err);
        if (section) section.classList.add('hidden');
      }
    }

    function switchAuthTab(tab) {
      const loginBtn = document.getElementById('tab-btn-login');
      const regBtn = document.getElementById('tab-btn-register');
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');

      if (tab === 'login') {
        loginBtn.className = 'flex-1 py-3.5 text-xs sm:text-sm font-bold text-emerald-700 border-b-2 border-emerald-600 bg-white transition';
        regBtn.className = 'flex-1 py-3.5 text-xs sm:text-sm font-semibold text-slate-500 hover:text-slate-800 transition';
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
      } else {
        regBtn.className = 'flex-1 py-3.5 text-xs sm:text-sm font-bold text-emerald-700 border-b-2 border-emerald-600 bg-white transition';
        loginBtn.className = 'flex-1 py-3.5 text-xs sm:text-sm font-semibold text-slate-500 hover:text-slate-800 transition';
        regForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }

    function fillDemo(email, pw) {
      switchAuthTab('login');
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pw;
      Pontinho.showToast(`E-mail e senha preenchidos para ${email}!`);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const data = await Pontinho.apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        Pontinho.setCurrentUserId(data.user.id);
        Pontinho.showToast(`Bem-vindo(a) de volta, ${data.user.name}! 🔥`, 'success');
        
        setTimeout(() => {
          window.location.href = './index.html';
        }, 600);

      } catch (err) {
        Pontinho.showToast(err.message, 'error');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const rawEmail = document.getElementById('reg-email').value.trim();
      const name = document.getElementById('reg-name').value.trim();
      const password = document.getElementById('reg-password').value;

      // Sanitização no cliente
      let email = rawEmail.toLowerCase();
      if (!email.includes('@')) {
        email += '@aluno.ufabc.edu.br';
      }

      if (!email.endsWith('@aluno.ufabc.edu.br') && !email.endsWith('@ufabc.edu.br')) {
        Pontinho.showToast('Insira um e-mail institucional válido.', 'error');
        return;
      }

      try {
        const data = await Pontinho.apiFetch('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ email, name, password })
        });

        Pontinho.setCurrentUserId(data.user_id);
        Pontinho.showToast(`Cadastro realizado com sucesso! Bem-vindo(a), ${data.name}! 🎓`, 'success');

        // Redireciona para completar o perfil (fotos e preferências)
        setTimeout(() => {
          window.location.href = './profile.html';
        }, 700);

      } catch (err) {
        Pontinho.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
