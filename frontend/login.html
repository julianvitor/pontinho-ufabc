<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pontinho - Entrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ufabc: {
              50: '#f0fdf4',
              100: '#dcfce7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#090d16] min-h-[100dvh] flex flex-col justify-center items-center p-3 sm:p-4 text-slate-100 font-sans antialiased relative overflow-x-hidden">
  
  <!-- Efeito de Luz de Fundo com Verde UFABC -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-emerald-500/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-0 right-0 w-[400px] h-[300px] bg-teal-500/10 rounded-full blur-[100px] pointer-events-none -z-10"></div>

  <!-- BARRA SUPERIOR DE AJUDA E RETORNO -->
  <header class="w-full max-w-md mx-auto mb-3 flex items-center justify-between px-2 z-10">
    <a href="./index.html" class="text-xs font-semibold text-slate-400 hover:text-emerald-400 flex items-center gap-1 transition">
      <span>❮</span> Início
    </a>
    <button type="button" onclick="Pontinho.openHelpModal()" class="px-2.5 py-1 text-xs font-semibold text-emerald-300 hover:text-emerald-200 bg-emerald-950/50 hover:bg-emerald-900/60 rounded-xl border border-emerald-800/40 transition flex items-center gap-1.5" title="Central de Ajuda e Segurança">
      <span>🛡️</span> <span>Ajuda</span>
    </button>
  </header>

  <!-- CARD PRINCIPAL DE AUTENTICAÇÃO -->
  <div class="w-full max-w-md bg-slate-900/90 rounded-3xl shadow-2xl overflow-hidden border border-slate-800/80 backdrop-blur-xl text-slate-100 transition-all shadow-black/80">
    
    <!-- CABEÇALHO -->
    <div class="bg-gradient-to-b from-emerald-950/60 via-slate-900 to-slate-900/90 py-7 px-8 text-center relative border-b border-emerald-500/20">
      <h1 class="text-3xl font-black tracking-tight bg-gradient-to-r from-emerald-400 via-teal-300 to-emerald-500 bg-clip-text text-transparent">Pontinho</h1>
    </div>

    <!-- SELETOR DE ABAS: LOGIN OU CADASTRO -->
    <div class="flex border-b border-slate-800 bg-slate-950/60">
      <button 
        id="tab-btn-login" 
        onclick="switchAuthTab('login')" 
        class="flex-1 py-3.5 text-xs sm:text-sm font-bold text-emerald-400 border-b-2 border-emerald-500 bg-slate-900/80 transition"
      >
        Entrar
      </button>
      <button 
        id="tab-btn-register" 
        onclick="switchAuthTab('register')" 
        class="flex-1 py-3.5 text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition"
      >
        Cadastrar-se
      </button>
    </div>

    <div class="p-5 sm:p-6">
      
      <!-- ABA 1: FORMULÁRIO DE LOGIN -->
      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">E-mail ou RA</label>
          <input 
            id="login-email" 
            type="text" 
            required 
            placeholder="nome@aluno.ufabc.edu.br" 
            class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition"
          >
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Senha</label>
          <input 
            id="login-password" 
            type="password" 
            required 
            placeholder="••••••••" 
            class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition"
          >
        </div>

        <button 
          type="submit" 
          class="w-full py-3 bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-slate-950 font-black text-xs sm:text-sm rounded-xl shadow-lg shadow-emerald-950/50 hover:shadow-emerald-900/60 transition active:scale-[0.99]"
        >
          Entrar
        </button>
      </form>

      <!-- ABA 2: FORMULÁRIO DE CADASTRO -->
      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3.5 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">E-mail Institucional UFABC</label>
          <input 
            id="reg-email" 
            type="email" 
            required 
            placeholder="nome.sobrenome@aluno.ufabc.edu.br" 
            class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition"
          >
          <p class="text-[10px] text-slate-500 mt-1">Exclusivo para estudantes e servidores (@aluno.ufabc.edu.br ou @ufabc.edu.br)</p>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Nome</label>
          <input 
            id="reg-name" 
            type="text" 
            required 
            placeholder="Como quer ser chamado(a)" 
            class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition"
          >
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">Senha</label>
          <input 
            id="reg-password" 
            type="password" 
            required 
            minlength="8" 
            placeholder="Mínimo 8 caracteres" 
            class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition"
          >
        </div>

        <div class="flex items-start gap-2.5 pt-1 text-left">
          <input 
            id="reg-terms" 
            type="checkbox" 
            required 
            class="mt-0.5 w-4 h-4 rounded border-slate-700 bg-slate-950 text-emerald-500 focus:ring-emerald-500/30 cursor-pointer"
          >
          <label for="reg-terms" class="text-[11px] text-slate-400 leading-tight cursor-pointer">
            Li e concordo com os <a href="./terms.html" target="_blank" class="text-emerald-400 hover:underline font-semibold">Termos de Uso</a> e autorizo o tratamento de dados pessoais segundo a <a href="./terms.html#lgpd" target="_blank" class="text-emerald-400 hover:underline font-semibold">Política de Privacidade (LGPD)</a>.
          </label>
        </div>

        <button 
          type="submit" 
          class="w-full py-3 bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-slate-950 font-black text-xs sm:text-sm rounded-xl shadow-lg shadow-emerald-950/50 hover:shadow-emerald-900/60 transition active:scale-[0.99]"
        >
          Criar Conta
        </button>
      </form>

      <!-- ATALHOS RÁPIDOS PARA CONTAS DE TESTE (CARREGADOS DINAMICAMENTE DO BACKEND) -->
      <div id="demo-section" class="mt-6 pt-5 border-t border-slate-800 text-center">
        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-2.5">
          Contas Demo:
        </span>
        <div id="demo-buttons-container" class="flex flex-wrap gap-1.5 justify-center">
          <span class="text-xs text-slate-500">Carregando contas...</span>
        </div>
      </div>

    </div>
  </div>

  <!-- RODAPÉ DE PRIVACIDADE E TERMOS DE USO -->
  <footer class="mt-6 text-center text-xs text-slate-500 flex items-center justify-center gap-3">
    <a href="./terms.html" class="hover:text-emerald-400 transition">Termos de Uso</a>
    <span>•</span>
    <a href="./terms.html#lgpd" class="hover:text-emerald-400 transition">Privacidade & LGPD</a>
  </footer>

  <script src="./js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('tab') === 'register') {
        switchAuthTab('register');
      }
      loadDemoAccounts();
    });

    async function loadDemoAccounts() {
      const container = document.getElementById('demo-buttons-container');
      const section = document.getElementById('demo-section');
      if (!container) return;

      try {
        const accounts = await Pontinho.apiFetch('/api/auth/demo-accounts');
        if (!accounts || accounts.length === 0) {
          if (section) section.classList.add('hidden');
          return;
        }

        container.innerHTML = accounts.map(acc => {
          const btnClass = "px-2.5 py-1 bg-slate-800/80 hover:bg-emerald-950/70 hover:text-emerald-300 hover:border-emerald-500/40 text-slate-300 rounded-lg text-[11px] font-medium border border-slate-700/60 transition";
          const shortName = (acc.name || 'Estudante').split(' ')[0];
          const escapedEmail = (acc.email || '').replace(/'/g, "\\'");
          return `<button type="button" onclick="fillDemo('${escapedEmail}', '123456')" class="${btnClass}">${shortName}</button>`;
        }).join('');
      } catch (err) {
        console.warn('Não foi possível carregar contas demo:', err);
        if (section) section.classList.add('hidden');
      }
    }

    function switchAuthTab(tab) {
      const loginBtn = document.getElementById('tab-btn-login');
      const regBtn = document.getElementById('tab-btn-register');
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');

      if (tab === 'login') {
        loginBtn.className = 'flex-1 py-3.5 text-xs sm:text-sm font-bold text-emerald-400 border-b-2 border-emerald-500 bg-slate-900/80 transition';
        regBtn.className = 'flex-1 py-3.5 text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition';
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
      } else {
        regBtn.className = 'flex-1 py-3.5 text-xs sm:text-sm font-bold text-emerald-400 border-b-2 border-emerald-500 bg-slate-900/80 transition';
        loginBtn.className = 'flex-1 py-3.5 text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition';
        regForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }

    function fillDemo(email, pw) {
      switchAuthTab('login');
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pw;
      Pontinho.showToast(`E-mail e senha preenchidos para ${email}!`);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const data = await Pontinho.apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        Pontinho.setCurrentUserId(data.user.id, data.token);
        Pontinho.showToast(`Bem-vindo(a) de volta, ${data.user.name}! 🔥`, 'success');
        
        setTimeout(() => {
          window.location.href = './index.html';
        }, 600);

      } catch (err) {
        Pontinho.showToast(err.message, 'error');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const rawEmail = document.getElementById('reg-email').value.trim();
      const name = document.getElementById('reg-name').value.trim();
      const password = document.getElementById('reg-password').value;

      const termsChecked = document.getElementById('reg-terms').checked;
      if (!termsChecked) {
        Pontinho.showToast('Você precisa aceitar os Termos de Uso e a Política de Privacidade (LGPD).', 'error');
        return;
      }

      if (!password || password.length < 8) {
        Pontinho.showToast('A senha deve conter no mínimo 8 caracteres.', 'error');
        return;
      }

      // Sanitização no cliente
      let email = rawEmail.toLowerCase();
      if (!email.includes('@')) {
        email += '@aluno.ufabc.edu.br';
      }

      if (!email.endsWith('@aluno.ufabc.edu.br') && !email.endsWith('@ufabc.edu.br')) {
        Pontinho.showToast('Cadastro permitido exclusivamente com e-mail @aluno.ufabc.edu.br ou @ufabc.edu.br.', 'error');
        return;
      }

      try {
        const data = await Pontinho.apiFetch('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ email, name, password, terms_accepted: true })
        });

        Pontinho.setCurrentUserId(data.user_id, data.token);
        Pontinho.showToast(`Cadastro realizado com sucesso! Bem-vindo(a), ${data.name}! 🎓`, 'success');

        // Redireciona para completar o perfil (fotos e preferências)
        setTimeout(() => {
          window.location.href = './profile.html';
        }, 700);

      } catch (err) {
        Pontinho.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
