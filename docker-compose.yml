services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pontinho-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistência do banco SQLite e uploads no host
      - ./data:/app/data
      - ./backend:/app/backend
      - ./scripts:/app/scripts
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/pontinho.db
      - PYTHONUNBUFFERED=1
      - MALLOC_TRIM_THRESHOLD_=100000
      - PYTHONMALLOC=malloc
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - PONTINHO_SECRET_KEY=${PONTINHO_SECRET_KEY:-pontinho_ufabc_secret_key_desenvolvimento_2026_super_forte_32ch}
      - DEV_MODE=${DEV_MODE:-true}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
    command: ["--reload", "--reload-dir", "backend", "--reload-include", "*.py"]
    mem_limit: 512m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pontinho-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
