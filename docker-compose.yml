services:
  pontinho-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pontinho-ufabc
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistência do banco SQLite no host (dentro da pasta ./data)
      - ./data:/app/data
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./scripts:/app/scripts
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/pontinho.db
      - PYTHONUNBUFFERED=1
