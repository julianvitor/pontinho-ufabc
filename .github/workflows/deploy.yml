name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main

jobs:
  test:
    name: 1. Testes Automatizados (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do Frontend
        working-directory: frontend
        run: npm ci

      - name: Executar testes unitários (Vitest)
        working-directory: frontend
        run: npm test

  deploy:
    name: 2. Deploy na VPS (CD)
    needs: test
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar integridade dos Secrets
        run: |
          echo "### Status dos Secrets do CD" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH_HOST presente**: $( [ -n "$HOST" ] && echo "Sim (tamanho ${#HOST})" || echo "NÃO CONFIGURADO / VAZIO" )" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH_USER presente**: $( [ -n "$USER" ] && echo "Sim (valor: $USER)" || echo "NÃO CONFIGURADO / VAZIO" )" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH_PRIVATE_KEY presente**: $( [ -n "$KEY" ] && echo "Sim (tamanho ${#KEY})" || echo "NÃO CONFIGURADO / VAZIO" )" >> $GITHUB_STEP_SUMMARY
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Conectar na VPS e executar atualização
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "### Log de Conexão SSH" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ssh -vvv -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/deploy_key -p 22 "$SSH_USER@$SSH_HOST" "/home/ubuntu/pontinho-backend/scripts/deploy.sh" 2>&1 | tee -a /tmp/ssh.log || SSH_STATUS=$?
          cat /tmp/ssh.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${SSH_STATUS:-0}" -ne 0 ]; then
            echo "SSH falhou com código de saída: $SSH_STATUS"
            exit "$SSH_STATUS"
          fi
