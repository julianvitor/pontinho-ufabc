name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main

jobs:
  test:
    name: 1. Testes Automatizados (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do Frontend
        working-directory: frontend
        run: npm ci

      - name: Executar testes unitários do Frontend (Vitest)
        working-directory: frontend
        run: npm test

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependências de Teste do Backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn argon2-cffi pillow python-multipart pytest httpx

      - name: Validar sintaxe e integridade do Backend (Python)
        run: python -m compileall backend scripts

      - name: Executar testes unitários do Backend (Pytest)
        run: pytest backend/tests/test_api.py -v

  deploy:
    name: 2. Deploy na VPS (CD)
    needs: test
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar integridade dos Secrets
        run: |
          echo "### Status dos Secrets do CD" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH_HOST presente**: $( [ -n "$HOST" ] && echo "Sim (tamanho ${#HOST})" || echo "NÃO CONFIGURADO / VAZIO" )" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH_USER presente**: $( [ -n "$USER" ] && echo "Sim (valor: $USER)" || echo "NÃO CONFIGURADO / VAZIO" )" >> $GITHUB_STEP_SUMMARY
          echo "- **SSH_PRIVATE_KEY presente**: $( [ -n "$KEY" ] && echo "Sim (tamanho ${#KEY})" || echo "NÃO CONFIGURADO / VAZIO" )" >> $GITHUB_STEP_SUMMARY
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Conectar na VPS e executar atualização
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=60 -i ~/.ssh/deploy_key -p 22 "$SSH_USER@$SSH_HOST" "/home/ubuntu/pontinho-backend/scripts/deploy.sh"
